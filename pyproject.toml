[project]
name = "careslot"
version = "0.1.0"
description = "CareSlot: online appointment booking for three outpatient clinics."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Exact pins, resolved by uv on 2026-11-23 (uv.lock holds the full tree).
# Day 1 adds celery, redis, django-axes and boto3 together with the code that uses them.
dependencies = [
    "dj-database-url==3.1.2",
    "django==6.1.3",
    "django-htmx==1.29.0",
    "gunicorn==27.0.1",
    "psycopg[binary,pool]==3.3.9",
    "python-json-logger==4.2.0",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.2",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*.py", "docs", "graphify-out", "knowledge"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "T20", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]  # line length: ruff format owns it

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101", "S106"]
"tests/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "docs/", "graphify-out/"]

[[tool.mypy.overrides]]
module = ["dj_database_url", "pythonjsonlogger.*", "whitenoise.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
