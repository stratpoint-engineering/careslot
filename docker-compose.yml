# Optional local services. Day 0 runs without them (SQLite). Use them to work against PostgreSQL:
#   docker compose up -d
#   DATABASE_URL=postgres://careslot:careslot@localhost:5432/careslot uv run python manage.py migrate
# Match the major versions to RDS / ElastiCache once the AWS region is chosen (ARCH §9 Q1).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careslot
      POSTGRES_PASSWORD: careslot
      POSTGRES_DB: careslot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careslot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-data:
